apiVersion: 1
datasources:
  - name: Cofrial RDS
    uid: cofrial-mysql
    type: mysql
    url: ${DB_HOST}:${DB_PORT}
    user: ${GRAFANA_DB_USER}            # usuario de SOLO LECTURA (grafana_ro), no el admin de RDS
    database: ${DB_NAME}
    isDefault: true
    jsonData:
      database: ${DB_NAME}
      timezone: "${DB_TIMEZONE}"
      maxOpenConns: 10
    secureJsonData:
      password: ${GRAFANA_DB_PASS}
