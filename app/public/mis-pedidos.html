<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis pedidos · Cofrial SpA</title>
<link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="cabecera"></div>
<main class="container pb-5">
<div id="aviso"></div>
<h2 class="fw-bold mb-3">Mis pedidos</h2>
<div id="lista"></div>
</main>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
const COLOR = { "Pendiente": "secondary", "Confirmado": "info", "En preparación": "warning", "En ruta": "primary", "Entregado": "success", "Cancelado": "danger" };
const COLOR_PAGO = { "Aprobado": "success", "Pendiente": "warning text-dark", "Rechazado": "danger", "Anulado": "secondary", "Reembolsado": "info" };
const pago = (p) => p.pago_estado
  ? `<span class="badge bg-${COLOR_PAGO[p.pago_estado]}">💳 Pago ${esc(p.pago_estado.toLowerCase())}${p.pago_tarjeta ? " · **** " + esc(p.pago_tarjeta) : ""}</span>` : "";
(async () => {
  const s = await cabecera("pedidos");
  if (!s) { location.href = "/cuenta?volver=/mis-pedidos"; return; }
  const peds = await api("/api/mis-pedidos");
  document.getElementById("lista").innerHTML = peds.map((p) => `
    <div class="card border-0 shadow-sm mb-3"><div class="card-body">
      <div class="d-flex justify-content-between flex-wrap gap-2">
        <div><b>Pedido N° ${p.id_pedido}</b> <span class="text-muted small">· ${esc(p.fecha_pedido)} · canal ${esc(p.canal)}</span></div>
        <div>${pago(p)} <span class="badge bg-${COLOR[p.estado] || "secondary"}">${esc(p.estado)}</span> ${p.camion_id ? `<span class="badge bg-light text-dark">🚚 ${esc(p.camion_id)}</span>` : ""}</div>
      </div>
      <ul class="small mt-2 mb-2">${p.items.map((i) => `<li>${i.cantidad} ${esc(i.unidad)} · ${esc(i.nombre)} (${CLP(i.precio_unitario)})</li>`).join("")}</ul>
      <div class="d-flex justify-content-between align-items-center gap-2 flex-wrap"><span class="small text-muted">${esc(p.observacion || "")}</span>
        <div class="d-flex align-items-center gap-3"><button class="btn btn-sm btn-outline-danger" onclick="reportarProblema(${p.id_pedido})">⚠ Reportar un problema</button>
        <b>Total ${CLP(p.total_con_iva)}</b></div></div>
    </div></div>`).join("") || `<p class="text-muted">Aún no tienes pedidos. <a href="/">Ir al catálogo</a></p>`;
})();
</script></body></html>
