<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar · Cofrial SpA</title>
<link href="/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
<link href="/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="cabecera"></div>
<main class="container pb-5">
<div id="aviso"></div>
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5"><div class="card border-0 shadow-sm"><div class="card-body p-4">
    <h4 class="fw-bold">Iniciar sesión</h4>
    <p class="text-muted small">Ingresa para ver tus precios, comprar y revisar tus pedidos.</p>
    <form id="f-login">
      <input class="form-control mb-2" name="email" type="email" placeholder="Email" autocomplete="username" required>
      <input class="form-control mb-3" name="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button class="btn btn-primary w-100">Ingresar</button>
    </form>
    <hr>
    <p class="text-center small mb-0">¿No tienes cuenta? <a id="ir-registro" href="/registro">Crear una cuenta</a></p>
  </div></div></div>
</div>
</main>
<script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/js/common.js"></script>
<script>
const volver = new URLSearchParams(location.search).get("volver") || "/";
const destino = volver.startsWith("/") && !volver.startsWith("//") ? volver : "/";   // solo rutas internas
(async () => {
  if (await cabecera()) { location.href = destino; return; }   // ya tiene sesión
  if (destino !== "/") document.getElementById("ir-registro").href = "/registro?volver=" + encodeURIComponent(destino);
  document.getElementById("f-login").onsubmit = async (e) => {
    e.preventDefault();
    try { await api("/api/auth/login", { method: "POST", body: Object.fromEntries(new FormData(e.target)) }); location.href = destino; }
    catch (err) { aviso(esc(err.message), "danger"); }
  };
})();
</script></body></html>
